name: Radar eBay Pokémon PSA

on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch: {}       # botão "Run workflow" para rodar na hora

permissions:
  contents: write             # para salvar a lista de anúncios já vistos

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  varredura:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rodar varredura
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LINK_APP: ${{ vars.LINK_APP }}
          DESCONTO_MINIMO: ${{ vars.DESCONTO_MINIMO || '30' }}
        run: python radar.py

      - name: Salvar anúncios já vistos
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          [ -f vistos.json ] || exit 0
          git add vistos.json
          git diff --cached --quiet || git commit -m "radar: atualiza anúncios vistos [skip ci]"
          git push || echo "nada para enviar"
